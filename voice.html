<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice - Tati</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif}
body{background:#f6f3ee;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:100dvh}
a{color:#0a192f;font-weight:800;text-decoration:none;font-size:13px}
.card{background:#fff;border-radius:12px;padding:14px;text-align:center}
.card b{font-size:15px}
.card p{font-size:12px;color:#667781;margin-top:4px}
.kbtn{width:100%;margin-top:10px;padding:14px;border-radius:10px;border:none;background:#0a192f;color:#fff;font-weight:800;font-size:15px;cursor:pointer}
.kbtn.green{background:#00a884}
.kbtn.red{background:#e11d48}
.kbtn.sec{background:#f0f2f5;color:#111}
#micBtn{width:110px;height:110px;border-radius:50%;border:none;background:#0a192f;color:#fff;font-size:40px;cursor:pointer;margin:10px auto;display:block}
#micBtn.on{background:#e11d48;animation:pulse 1s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
#voiceText{background:#fff;border-radius:12px;padding:14px;min-height:120px;font-size:15px;line-height:1.5;white-space:pre-wrap}
select{width:100%;padding:11px;border:1px solid #ddd;border-radius:9px;margin-top:6px;font-size:14px}
</style></head><body>

<a href="./index.html">← Back to Tati</a>

<div class="card">
<b>🎤 Voice - Tap Once, Talk Forever</b>
<p>Tap mic once, speak. Tap again to stop. Tati types what you said.</p>
<select id="voiceLang">
<option value="pt-PT">Portuguese</option>
<option value="en-US">English</option>
<option value="ts-ZA">xiChangana / Tsonga</option>
</select>
<button id="micBtn" onclick="toggleVoice()">🎤</button>
<p id="voiceStatus">Tap mic to start</p>
</div>

<div id="voiceText">Your words will appear here...</div>

<div class="card">
<button class="kbtn green" onclick="sendToTati()">➤ Send to Tati Chat</button>
<button class="kbtn sec" onclick="document.getElementById('voiceText').textContent=''">🗑️ Clear</button>
<button class="kbtn sec" onclick="speakBack()">🔊 Hear Tati Speak It</button>
</div>

<script>
var rec=null, listening=false, finalText="";
function toggleVoice(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert("Voice not supported in this browser. Try Chrome on Android.");return}
  if(listening){rec.stop();return}
  rec=new SR();
  rec.lang=document.getElementById("voiceLang").value;
  rec.continuous=true; rec.interimResults=true;
  rec.onstart=function(){listening=true;document.getElementById("micBtn").classList.add("on");document.getElementById("voiceStatus").textContent="● Listening... Tap again to stop";};
  rec.onend=function(){listening=false;document.getElementById("micBtn").classList.remove("on");document.getElementById("voiceStatus").textContent="Stopped. Tap to talk again";};
  rec.onresult=function(e){
    var txt=""; for(var i=0;i<e.results.length;i++){txt+=e.results[i][0].transcript+" ";}
    finalText=txt; document.getElementById("voiceText").textContent=txt;
  };
  rec.onerror=function(){listening=false;document.getElementById("micBtn").classList.remove("on");document.getElementById("voiceStatus").textContent="Mic error - allow mic permission";};
  rec.start();
}
function sendToTati(){
  var t=document.getElementById("voiceText").textContent.trim();
  if(!t||t.indexOf("Your words")===0){alert("Speak first, then send");return}
  localStorage.setItem("tati_voice_msg",t);
  alert("Saved! Go back to Tati: "+t);
  location.href="./index.html";
}
function speakBack(){
  var t=document.getElementById("voiceText").textContent.trim(); if(!t) return;
  var u=new SpeechSynthesisUtterance(t); u.lang=document.getElementById("voiceLang").value; speechSynthesis.speak(u);
}
</script>
</body></html>
