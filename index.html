<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tati - SHYNONE MUSIC</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif}
body{display:flex;flex-direction:column;height:100dvh;background:#fff;overflow:hidden}
#header{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-bottom:3px solid #0a192f;flex-shrink:0}
#avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid #00a884}
#centerLogo{flex:1;text-align:center;line-height:1;cursor:pointer;border-left:1px solid #ddd;border-right:1px solid #ddd;margin:0 8px}
#centerLogo b{font-size:14px;font-weight:900}
#centerLogo i{font-style:normal;font-size:8px;letter-spacing:3px;color:#00a884;font-weight:700}
.topBtn{padding:8px 9px;border-radius:15px;border:none;font-size:12px;font-weight:800;cursor:pointer;background:#f0f2f5;text-decoration:none;color:#111}
#greenLine{height:4mm;background:#00a884;flex-shrink:0}
#safeBar{display:flex;gap:8px;padding:10px;overflow-x:auto;flex-shrink:0}
.pill{padding:9px 13px;border-radius:999px;border:none;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap;background:#00a884;color:#fff;text-decoration:none}
#modeSwitch{display:flex;background:#f0f2f5;padding:4px;margin:0 8px 10px;border-radius:12px;gap:4px;flex-shrink:0;overflow-x:auto;align-items:center}
.modeBtn{padding:10px 10px;border-radius:9px;border:none;font-weight:800;font-size:13px;cursor:pointer;background:transparent;white-space:nowrap;text-decoration:none;color:#111;text-align:center;flex-shrink:0}
.modeBtn.active{background:#0a192f;color:#fff}
.doubleBtn{display:flex;background:#fff;border:1px solid #ddd;border-radius:9px;overflow:hidden;white-space:nowrap;padding:0;margin:0;flex-shrink:0}
.doubleBtn button,.doubleBtn a{padding:10px 8px;border:none;background:#fff;font-weight:800;font-size:13px;cursor:pointer;text-decoration:none;color:#111;text-align:center;margin:0;line-height:1.2}
.doubleBtn .divider{width:1px;background:#bbb;flex:none;flex-shrink:0;margin:7px 0}
.doubleBtn button.on{background:#00a884;color:#fff}
.doubleBtn a.active{background:#0a192f;color:#fff}
.page{flex:1;overflow-y:auto;padding:12px;background:#f6f3ee;display:flex;flex-direction:column;gap:6px}
.bubble{max-width:80%;padding:9px 12px;font-size:15px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.user{align-self:flex-end;background:#d9fdd3}
.tati{align-self:flex-start;background:#fff}
#inputArea{background:#f0f2f5;padding:8px;display:flex;gap:6px;flex-shrink:0}
#textBox{flex:1;background:#fff;border-radius:22px;padding:9px 12px;display:flex}
#textInput{flex:1;border:none;outline:none;font-size:16px;resize:none}
#sendBtn{width:44px;height:44px;border-radius:50%;border:none;background:#0a192f;color:#fff;font-size:17px;cursor:pointer;flex-shrink:0}
#kbHint{font-size:11px;color:#667781;text-align:center;padding:4px 10px 8px;line-height:1.4}
</style></head><body>

<div id="header">
<div style="display:flex;gap:8px;align-items:center">
<img id="avatar" src="./Tate.jpg" onerror="this.src='https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=400'">
<b>Tati <span style="font-size:10px;color:#00a884">● Online</span></b>
</div>
<div id="centerLogo"><b>SHYNONE</b><br><i>MUSIC</i></div>
<!-- ONLY GLOBE + BELL NOW - NO CH/EN/PT BUTTONS -->
<div style="display:flex;gap:4px;align-items:center">
<a class="topBtn" href="./langs.html">🌐 ▼</a>
<a class="topBtn" href="./requests.html">🔔<span>0</span></a>
</div>
</div>

<div id="greenLine"></div>

<!-- ONLY 3 GREEN BUTTONS NOW - SAFE CONTAINS CONTACTS + DOCS -->
<div id="safeBar">
<a class="pill" href="./safe.html">🛡️ SAFE</a>
<a class="pill" href="./fact.html">💡 DID YOU KNOW</a>
<a class="pill" href="./create.html">✨ CREATE</a>
</div>

<!-- NO BOTTOM CREATE ANYMORE - KILLED. ONLY People, Text|Talk, Listen|History -->
<div id="modeSwitch">
<a class="modeBtn" href="./people.html">👥 People</a>
<div class="doubleBtn">
<a class="active" href="./index.html">💬 Text</a>
<div class="divider"></div>
<a href="./voice.html">🎤 Talk</a>
</div>
<div class="doubleBtn">
<button id="listenBtn" onclick="toggleListenMain()">👂 Listen</button>
<div class="divider"></div>
<a href="./listen.html">History</a>
</div>
</div>

<div class="page"><div id="chat"></div></div>

<div id="inputArea"><div id="textBox"><textarea id="textInput" placeholder="Message Tati..." rows="1"></textarea></div><button id="sendBtn">➤</button></div>
<div id="kbHint">⌨️ Keyboard is built-in inside Tati - CH / EN / PT included. New languages from 🌐 go to keyboard automatically.</div>

<script>
function addBubble(t,type){var b=document.createElement("div");b.className="bubble "+type;b.innerHTML="<span>"+t+"</span>";document.getElementById("chat").appendChild(b)}
document.getElementById("sendBtn").onclick=function(){
  var q=document.getElementById("textInput").value.trim(); if(!q) return;
  addBubble(q,"user"); document.getElementById("textInput").value="";
  addBubble("Hi!","tati");
};
document.getElementById("centerLogo").onclick=function(){window.open('https://shynoneofficial.github.io/shynone-music/','_blank')};
var listenRec=null, listenOn=false;
function getListenSettings(){try{return JSON.parse(localStorage.getItem("tati_listen_settings")||"{}")}catch(e){return {}}}
function toggleListenMain(){
  if(listenOn){ if(listenRec) listenRec.stop(); return; }
  var names=localStorage.getItem("tati_listen_names")||"";
  if(!names){ var n=prompt("👂 Who is here? What are your names? (ex: Jemi, Mama, Thabo)"); if(n){ localStorage.setItem("tati_listen_names",n); } }
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert("Listen not supported here. Try Chrome on Android.");return}
  listenRec=new SR(); listenRec.lang="pt-PT"; listenRec.continuous=true; listenRec.interimResults=true;
  listenRec.onstart=function(){ listenOn=true; localStorage.setItem("tati_listen_on","1"); var btn=document.getElementById("listenBtn"); btn.textContent="👂 Listening"; btn.classList.add("on"); };
  listenRec.onend=function(){ listenOn=false; localStorage.setItem("tati_listen_on","0"); var btn=document.getElementById("listenBtn"); btn.textContent="👂 Listen"; btn.classList.remove("on"); };
  listenRec.onresult=function(e){
    var txt=""; for(var i=0;i<e.results.length;i++){txt+=e.results[i][0].transcript+" ";}
    txt=txt.trim(); if(!txt) return;
    var all=[]; try{all=JSON.parse(localStorage.getItem("tati_listen")||"[]")}catch(err){}
    all.push({date:new Date().toLocaleString(),text:txt}); localStorage.setItem("tati_listen",JSON.stringify(all));
    var s=getListenSettings(); if(s.quiet) return;
    var low=txt.toLowerCase();
    if(low.indexOf("tati")>-1){ addBubble("👂 I heard my name! How can I help?","tati"); }
    else if(low.indexOf("haha")>-1 || low.indexOf("funny")>-1){ if(s.funny!==false) addBubble("😂 Hahaha! That was funny!","tati"); }
  };
  listenRec.start();
}
addBubble("Avuxeni! Hi mina Tati.","tati");
</script>
</body></html>
