<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif}
body{display:flex;flex-direction:column;height:100dvh;background:#fff;overflow:hidden}
#header{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-bottom:3px solid #0a192f;flex-shrink:0}
#avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid #00a884}
#centerLogo{flex:1;text-align:center;line-height:1;cursor:pointer;border-left:1px solid #ddd;border-right:1px solid #ddd;margin:0 8px}
#centerLogo b{font-size:13px;font-weight:900}
#centerLogo i{font-style:normal;font-size:7px;letter-spacing:3px;color:#00a884;font-weight:700}
.topBtn{padding:6px 7px;border-radius:15px;border:none;font-size:10px;font-weight:800;cursor:pointer;background:#f0f2f5}
.topBtn.active{background:#0a192f;color:#fff}
#greenLine{height:4mm;background:#00a884;flex-shrink:0}
#safeBar{display:flex;gap:6px;padding:8px 10px;overflow-x:auto;flex-shrink:0}
.pill{padding:6px 9px;border-radius:999px;border:none;font-weight:700;font-size:9.5px;cursor:pointer;white-space:nowrap;background:#00a884;color:#fff;text-decoration:none}
#modeSwitch{display:flex;background:#f0f2f5;padding:4px;margin:0 8px 8px;border-radius:10px;gap:4px;flex-shrink:0;overflow-x:auto}
.modeBtn{flex:1;padding:9px 6px;border-radius:8px;border:none;font-weight:800;font-size:11px;cursor:pointer;background:transparent;white-space:nowrap;text-decoration:none;color:#111;text-align:center}
.modeBtn.active{background:#0a192f;color:#fff}
.page{flex:1;overflow-y:auto;padding:12px;background:#f6f3ee;display:flex;flex-direction:column;gap:6px}
.bubble{max-width:80%;padding:7px 10px;font-size:14px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.user{align-self:flex-end;background:#d9fdd3}
.tati{align-self:flex-start;background:#fff}
#inputArea{background:#f0f2f5;padding:7px;display:flex;gap:6px;flex-shrink:0}
#textBox{flex:1;background:#fff;border-radius:22px;padding:8px 12px;display:flex}
#textInput{flex:1;border:none;outline:none;font-size:16px;resize:none}
#sendBtn{width:42px;height:42px;border-radius:50%;border:none;background:#0a192f;color:#fff;font-size:16px;cursor:pointer}
.card{background:#fff;border-radius:12px;padding:14px}

<script>
function addBubble(t,type){var b=document.createElement("div");b.className="bubble "+type;b.innerHTML="<span>"+t+"</span>";document.getElementById("chat").appendChild(b)}
document.getElementById("sendBtn").onclick=function(){
  var q=document.getElementById("textInput").value.trim(); if(!q) return;
  addBubble(q,"user"); document.getElementById("textInput").value="";
  addBubble("Hi! I am clean shell Tati. People is now separate - tap 👥 People above.","tati");
};
addBubble("Avuxeni! Hi mina Tati. STEP 1 Shell + STEP 2 People (separate file) are ready.","tati");
