<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Secret Room - Tati</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif}
body{background:#f6f3ee;padding-bottom:20px}
.topbar{background:#0a192f;color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.topbar a{color:#fff;text-decoration:none;font-weight:800;font-size:14px}
.logo{font-size:22px;font-weight:900;letter-spacing:-.5px}
.logo span{color:#00a884}
.topbar .tag{font-size:11px;background:#00a884;padding:4px 8px;border-radius:999px;font-weight:800}
.wrap{max-width:1100px;margin:0 auto;padding:12px}
.layout{display:flex;gap:12px;align-items:flex-start}
.left{width:340px;flex-shrink:0;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.right{flex:1;background:#fff;border-radius:16px;height:calc(100vh - 140px);min-height:560px;max-height:720px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08);position:sticky;top:70px}
.leftHead{padding:12px}
.search{width:100%;padding:11px 12px;border:1px solid #ddd;border-radius:999px;font-size:14px;outline:none;background:#f0f2f5}
.topActions{display:flex;gap:8px;margin-top:10px}
.topActions button{flex:1;padding:10px;border:none;border-radius:999px;font-weight:800;font-size:12px;cursor:pointer}
.btnAdd{background:#0a192f;color:#fff}
.btnReq{background:#fff3cd;color:#111}
.person{padding:11px 12px;display:flex;gap:10px;align-items:center;cursor:pointer;border-bottom:1px solid #f0f2f5}
.person.active{background:#eef7f2;border-left:4px solid #00a884}
.person img{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#eee}
.person .info{flex:1;min-width:0}
.person .info b{font-size:14px;display:flex;gap:6px;align-items:center}
.person .info span{font-size:12px;color:#667781;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatHead{padding:12px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #f0f2f5;background:#fff;flex-shrink:0}
.chatHead img{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#eee}
.chatHead .info{flex:1}
.chatHead .info b{font-size:16px}
.chatHead .info span{font-size:12px;color:#667781;display:block}
.backBtn{display:none;background:#0a192f;color:#fff;border:none;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer}
.chatBody{flex:1;min-height:0;padding:14px;overflow-y:auto;background:#efeae2;display:flex;flex-direction:column;align-items:flex-start}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;color:#667781}
.msg{width:fit-content;max-width:78%;padding:9px 12px 6px 12px;border-radius:14px;font-size:14px;line-height:1.4;margin-bottom:8px;word-break:break-word;cursor:pointer}
.msg.me{background:#dde9f5;margin-left:auto;align-self:flex-end;border-bottom-right-radius:4px}
.msg.them{background:#fff;margin-right:auto;align-self:flex-start;border-bottom-left-radius:4px}
.msgMeta{display:flex;justify-content:flex-end;gap:5px;margin-top:4px;font-size:10px;color:#667781}
.replyQuote{background:rgba(0,0,0,.07);border-left:3px solid #00a884;padding:6px 8px;border-radius:8px;font-size:12px;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dateDivider{align-self:center;background:#fff;padding:5px 12px;border-radius:999px;font-size:11px;font-weight:800;margin:12px 0}
.chatInput{display:flex;gap:8px;padding:10px;border-top:1px solid #f0f2f5;background:#fff;flex-direction:column;flex-shrink:0}
.chatInputRow{display:flex;gap:8px;align-items:center}
.chatInput input{flex:1;padding:12px;border:1px solid #ddd;border-radius:999px;outline:none;font-size:14px}
.send{width:40px;height:32px;border:none;background:transparent;cursor:pointer}
.micBtn{width:46px;height:46px;border:none;border-radius:50%;background:#dde9f5;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.replyBar{display:none;background:#eef7f2;border-left:3px solid #00a884;padding:8px 10px;border-radius:8px;font-size:12px;align-items:center;justify-content:space-between}
.btn{display:block;width:100%;max-width:360px;padding:13px 20px;border:none;border-radius:12px;font-weight:800;font-size:14px;cursor:pointer;text-align:center;margin:12px auto 0 auto}
.btn-green{background:#00a884;color:#fff}
.hidden{display:none!important}
.holdOverlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99;display:none;align-items:flex-end;justify-content:center}
.holdBox{background:#fff;width:100%;max-width:420px;border-radius:18px 18px 0 0;padding:16px 16px 22px}
.holdBox button{width:100%;padding:13px;border:none;background:#f0f2f5;border-radius:12px;font-weight:800;font-size:14px;margin-top:8px;cursor:pointer;text-align:left}
.holdBox button.danger{background:#ffe0e0;color:#b00020}
.voiceRow{display:flex;align-items:center;gap:8px}
.voicePlay{width:30px;height:30px;border:none;border-radius:50%;background:#0a2a8a;color:#fff;font-size:12px;cursor:pointer}
.voiceBars{display:flex;gap:2px;align-items:center;height:26px;flex:1}
.voiceBars i{display:block;width:3px;background:#0a2a8a;border-radius:2px}
.voiceDur{font-size:11px;font-weight:700}
.recBar{display:none;background:#0a192f;color:#fff;padding:8px 10px;border-radius:999px;font-size:12px;align-items:center;gap:6px}
.recBar button{border:none;padding:7px 10px;border-radius:999px;font-weight:800;font-size:13px;cursor:pointer}
.waveCanvas{flex:1;height:28px}
.fileCard{background:rgba(0,0,0,.06);border-radius:10px;padding:8px;margin-bottom:4px;font-size:12px}
.fileCard button{padding:7px 10px;border:none;border-radius:999px;background:#0a192f;color:#fff;font-weight:800;font-size:12px;margin-top:6px;cursor:pointer}
@media(max-width:820px){.layout{flex-direction:column}.left,.right{width:100%}.backBtn{display:block}body.chatOpen .left{display:none}body.chatOpen .right{height:calc(100dvh - 60px);position:fixed;top:54px;left:0;right:0;bottom:0;z-index:30;border-radius:0}body.chatOpen{overflow:hidden;height:100dvh}body.chatOpen .wrap{padding:0}body.chatOpen .chatInput{position:fixed;left:0;right:0;bottom:0}body:not(.chatOpen) #chatPane{display:none}body.chatOpen #chatPane{display:flex}}
</style></head><body>
<div class="topbar"><a href="./index.html">←</a><div class="logo">Tati<span>.</span></div><div class="tag">🔒 Secret Room</div><div style="flex:1"></div><a href="./index.html">Home</a></div>
<div class="wrap">
<div id="mainLayout" class="layout">
<div class="left"><div class="leftHead">
<input class="search" id="searchPeople" placeholder="🔍 Search my secret people..." oninput="renderAll()">
<div class="topActions"><button class="btnAdd" onclick="toggleAdd()">➕ Add Secret Person</button><button class="btnReq" onclick="goBackToList()">← Back</button></div>
<div id="addBox" class="hidden" style="margin-top:12px;border-top:1px solid #eee;padding-top:12px"><label style="font-size:12px;font-weight:800">SECRET PERSON'S NAME *</label><input id="addName" placeholder="Ex: Jemi" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-top:4px"><button class="btn btn-green" onclick="addSecretPerson()">➕ Add Secret Person</button><p id="addMsg" style="font-size:12px;color:#667781;margin-top:6px"></p></div>
</div><div id="peopleList"></div></div>
<div class="right" id="chatPane">
<div id="chatEmpty" class="empty"><div style="font-size:48px">🔒</div><h2>Pick a secret person on the left</h2><p>Same as People, but private. Your chats stay here.</p></div>
<div id="chatActive" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0;height:100%">
<div class="chatHead"><button class="backBtn" onclick="goBackToList()">←</button><img id="chatImg"><div class="info"><b id="chatName"></b><span id="chatSub">Secret • Your chats stay here</span></div></div>
<div class="chatBody" id="chatBody"></div>
<div class="chatInput"><div id="replyBar" class="replyBar"><span id="replyBarText"></span><span onclick="cancelReply()" style="cursor:pointer;font-weight:800">✕</span></div>
<div id="recBar" class="recBar"><button style="background:#fff;color:#111" onclick="cancelVoice()">🗑️</button><button id="recPlayBtn" style="background:#00a884;color:#fff;display:none" onclick="toggleRecPreview()">▶️</button><canvas id="waveCanvas" class="waveCanvas" width="220" height="28"></canvas><span id="recBarText" style="font-weight:800">00:00</span><button id="pauseBtn" style="background:#fff;color:#111" onclick="togglePauseVoice()">⏸️</button><button style="background:#fff;color:#111" onclick="stopVoiceRecording()">⏹️</button><button style="background:#00a884;color:#fff" onclick="sendVoice()">Send</button></div>
<div class="chatInputRow" id="normalInputRow"><button class="micBtn" onclick="toggleMic()">🎤</button><button class="micBtn" onclick="document.getElementById('fileInput').click()" title="Send file" style="background:#fff3cd">📎</button><input type="file" id="fileInput" class="hidden"><input id="chatText" placeholder="Type a secret message..." onkeydown="if(event.key==='Enter') sendChat()"><button class="send" onclick="sendChat()"><svg viewBox="0 0 32 22" fill="none" stroke="#0a2a8a" stroke-width="1.6"><rect x="2" y="2" width="28" height="18" rx="2" fill="#fff"/><path d="M2 4 L16 12 L30 4"/></svg></button></div>
</div></div></div></div></div>
<div id="msgHoldOverlay" class="holdOverlay" onclick="closeMsgMenu()"><div class="holdBox" onclick="event.stopPropagation()"><b>Message</b><div id="msgHoldButtons"></div><button onclick="closeMsgMenu()">❌ Close</button></div></div>
<div id="dlOverlay" class="holdOverlay" onclick="closeDl()"><div class="holdBox" onclick="event.stopPropagation()"><b id="dlTitle">📎 Download file?</b><p id="dlName" style="font-size:13px;color:#333;margin-top:6px"></p><div><button onclick="dlToPhone()">📱 Download to Phone</button><button onclick="dlToSafe()">📦 Save to Safe Box</button><button onclick="closeDl()">❌ Cancel</button></div></div></div>
<script>
var WORKER_URL="https://tati-server.dilemahluza.workers.dev";
async function cloudCall(b){try{var r=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});return await r.json()}catch(e){return{ok:false}}}
function getProfile(){try{return JSON.parse(localStorage.getItem('tati_my_profile')||'{}')}catch(e){return{}}}
function myCleanPhone(){var p=getProfile();var s=String(p.number||"").replace(/\D/g,"");if(s.startsWith("258")&&s.length===12)s=s.slice(3);if(s.startsWith("0")&&s.length===10)s=s.slice(1);return s}
let SECRET_PEOPLE=[];try{SECRET_PEOPLE=JSON.parse(localStorage.getItem("tati_secret_people")||"[]")}catch(e){SECRET_PEOPLE=[]}
let selectedName=null,replyToText=null,msgHoldIndex=-1,msgHoldTimer=null,dlMsg=null;
function savePeople(){localStorage.setItem("tati_secret_people",JSON.stringify(SECRET_PEOPLE))}
function chatKey(n){return "tati_secret_chat_"+n}
function getMsgs(n){try{return JSON.parse(localStorage.getItem(chatKey(n))||"[]")}catch(e){return[]}}
function setMsgs(n,a){localStorage.setItem(chatKey(n),JSON.stringify(a))}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function fmtTime(ts){var d=new Date(ts);var h=d.getHours(),m=d.getMinutes();return (h<10?'0'+h:h)+':'+(m<10?'0'+m:m)}
function fmtDur(s){s=Math.round(s||0);var m=Math.floor(s/60),r=s%60;return m+':'+(r<10?'0'+r:r)}
function dayLabel(ts){var d=new Date(ts);var today=new Date();var y=new Date();y.setDate(today.getDate()-1);function same(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}if(same(d,today))return 'Today';if(same(d,y))return 'Yesterday';return d.getDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]+' '+d.getFullYear()}
function toggleAdd(){document.getElementById("addBox").classList.toggle("hidden")}
function addSecretPerson(){var n=document.getElementById("addName").value.trim();if(!n){document.getElementById("addMsg").textContent="Type a name first.";return}if(SECRET_PEOPLE.find(function(p){return p.name===n})){document.getElementById("addMsg").textContent="Already added.";return}SECRET_PEOPLE.push({name:n,photo:"https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=200"});savePeople();document.getElementById("addName").value="";document.getElementById("addMsg").textContent="✅ Added "+n;renderAll();openChat(n)}
function renderAll(){var q=(document.getElementById("searchPeople").value||"").toLowerCase();var f=SECRET_PEOPLE.filter(function(r){return r.name.toLowerCase().includes(q)});var pl=document.getElementById("peopleList");if(!f.length){pl.innerHTML='<p style="padding:12px;font-size:12px;color:#667781">No secret people yet. Tap ➕ Add Secret Person.</p>'}else{pl.innerHTML=f.map(function(r){var msgs=getMsgs(r.name);var last=msgs.length?(msgs[msgs.length-1].type==="voice"?"Voice - "+fmtDur(msgs[msgs.length-1].dur||0):msgs[msgs.length-1].type==="file"?"📎 "+(msgs[msgs.length-1].fileName||"File"):msgs[msgs.length-1].text):"Secret chat";return '<div class="person '+(selectedName===r.name?'active':'')+'" onclick="openChat(\''+esc(r.name)+'\')"><img src="'+r.photo+'"><div class="info"><b>'+esc(r.name)+'</b><span>'+esc(last)+'</span></div><span>›</span></div>'}).join('')}if(selectedName)renderChat(false)}
function openChat(name){selectedName=name;document.body.classList.add("chatOpen");renderAll();document.getElementById("chatEmpty").classList.add("hidden");var a=document.getElementById("chatActive");a.classList.remove("hidden");a.style.display="flex";var p=SECRET_PEOPLE.find(function(x){return x.name===name})||{name:name,photo:"https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=200"};document.getElementById("chatImg").src=p.photo;document.getElementById("chatName").textContent=p.name;renderChat(true);pollSecret()}
function goBackToList(){document.body.classList.remove("chatOpen");selectedName=null;document.getElementById("chatActive").classList.add("hidden");document.getElementById("chatEmpty").classList.remove("hidden");renderAll()}
function waveBarsHTML(levels,seed){var bars='';for(var i=0;i<22;i++){var v=levels&&levels[i]!==undefined?levels[i]:(0.25+0.55*Math.abs(Math.sin(seed*3.7+i*1.3)));bars+='<i style="height:'+Math.max(4,Math.round(v*24))+'px"></i>'}return '<span class="voiceBars">'+bars+'</span>'}
function renderChat(force){if(!selectedName)return;var msgs=getMsgs(selectedName);var body=document.getElementById("chatBody");var html='';var lastDay='';msgs.forEach(function(m,i){var dL=dayLabel(m.time||Date.now());if(dL!==lastDay){html+='<div class="dateDivider">'+dL+'</div>';lastDay=dL}var q=m.replyTo?'<div class="replyQuote">↩️ '+esc(m.replyTo)+'</div>':'';var content='',meta='<div class="msgMeta"><span>'+fmtTime(m.time||Date.now())+'</span></div>';if(m.type==='voice'){content='<div class="voiceRow"><button class="voicePlay" onclick="event.stopPropagation();playVoice(\''+m.id+'\',this)">▶️</button>'+waveBarsHTML(m.wave,i+1)+'<span class="voiceDur">'+fmtDur(m.dur||0)+'</span></div>'}else if(m.type==='file'){content='<div class="fileCard">📎 '+esc(m.fileName||"File")+'<br><span style="color:#666">'+esc(m.fileType||"")+'</span><br><button onclick="event.stopPropagation();askDownload('+i+')">⬇️ Download</button></div>'}else{content='<span>'+esc(m.text)+'</span>'}html+='<div class="msg '+(m.me?'me':'them')+'" oncontextmenu="openMsgMenu(event,'+i+');return false;" onmousedown="startMsgHold(event,'+i+')" onmouseup="endMsgHold()" ontouchstart="startMsgHold(event,'+i+')" ontouchend="endMsgHold()">'+q+content+meta+'</div>'});body.innerHTML=html||'<p style="text-align:center;font-size:12px;color:#667781">No messages yet. Say hello privately 👋</p>';body.scrollTop=body.scrollHeight}
function startMsgHold(e,i){msgHoldIndex=i;clearTimeout(msgHoldTimer);msgHoldTimer=setTimeout(function(){openMsgMenu(e,i)},500)}
function endMsgHold(){clearTimeout(msgHoldTimer)}
function openMsgMenu(e,i){endMsgHold();if(e)e.preventDefault();msgHoldIndex=i;var m=getMsgs(selectedName)[i];if(!m)return;var html='<button onclick="msgReply()">↩️ Reply</button><button onclick="msgCopy()">📋 Copy</button>';if(m.type==='file')html+='<button onclick="askDownload('+i+')">⬇️ Download - Phone or Safe Box?</button>';if(m.me)html+='<button class="danger" onclick="msgDelete()">🗑️ Delete my message</button>';document.getElementById("msgHoldButtons").innerHTML=html;document.getElementById("msgHoldOverlay").style.display='flex'}
function closeMsgMenu(){document.getElementById("msgHoldOverlay").style.display='none';msgHoldIndex=-1}
function msgReply(){var m=getMsgs(selectedName)[msgHoldIndex];if(!m)return;replyToText=m.type==='voice'?'Voice - '+fmtDur(m.dur||0):m.type==='file'?'📎 '+(m.fileName||"File"):m.text;document.getElementById("replyBar").style.display='flex';document.getElementById("replyBarText").textContent='↩️ Replying to: '+replyToText;closeMsgMenu();document.getElementById("chatText").focus()}
function cancelReply(){replyToText=null;document.getElementById("replyBar").style.display='none'}
function msgCopy(){var m=getMsgs(selectedName)[msgHoldIndex];if(m){navigator.clipboard.writeText(m.type==='file'?'📎 '+(m.fileName||"File"):m.text);alert('📋 Copied!')}closeMsgMenu()}
function msgDelete(){var arr=getMsgs(selectedName);if(!confirm("Delete this message?")){closeMsgMenu();return}arr.splice(msgHoldIndex,1);setMsgs(selectedName,arr);closeMsgMenu();renderChat(true);renderAll()}
async function sendChat(){if(!selectedName)return;var inp=document.getElementById("chatText");var t=inp.value.trim();if(!t)return;var arr=getMsgs(selectedName);var id="s_"+Date.now();arr.push({id:id,me:true,text:t,replyTo:replyToText||"",time:Date.now(),type:"text"});setMsgs(selectedName,arr);inp.value='';cancelReply();renderChat(true);renderAll();cloudCall({action:"send_message",from:myCleanPhone(),to:"secret_"+selectedName,text:t,replyTo:replyToText||"",secret:true})}
async function pollSecret(){if(!selectedName||!myCleanPhone())return;var d=await cloudCall({action:"get_messages",me:myCleanPhone(),since:0});if(!d||!d.messages)return;var arr=getMsgs(selectedName);var changed=false;d.messages.forEach(function(m){if(m.secret&&String(m.from||"")==="secret_"+selectedName){if(!arr.some(function(x){return x.id===m.id})){arr.push({id:m.id,me:false,text:m.text,replyTo:m.replyTo||"",time:m.at,type:m.type||"text",data:m.data||"",dur:m.dur||0,wave:m.wave||null,fileName:m.fileName||"",fileType:m.fileType||""});changed=true}}});if(changed){setMsgs(selectedName,arr);renderChat(true);renderAll()}}
// Voice - same as People, saved
var isRecording=false,isPaused=false,mediaRecorder=null,voiceChunks=[],voiceBlob=null,voiceUrl='',recTimerInt=null,recSecs=0,audioCtx=null,analyser=null,micStream=null,waveLevels=[],waveRAF=null,previewAudio=null,isPreviewPlaying=false;
function drawWaveBars(){var cv=document.getElementById("waveCanvas");if(!cv)return;var ctx=cv.getContext("2d");ctx.clearRect(0,0,cv.width,cv.height);ctx.fillStyle="#00a884";var n=waveLevels.length||1;var bw=cv.width/n;for(var i=0;i<waveLevels.length;i++){ctx.fillRect(i*bw,(cv.height-Math.max(2,waveLevels[i]*cv.height))/2,Math.max(2,bw-1),Math.max(2,waveLevels[i]*cv.height))}}
async function toggleMic(){if(!selectedName){alert("Pick a secret person first");return}if(!isRecording){await startVoiceRecording()}else{stopVoiceRecording()}}
async function startVoiceRecording(){try{micStream=await navigator.mediaDevices.getUserMedia({audio:true});audioCtx=new (window.AudioContext||window.webkitAudioContext)();var src=audioCtx.createMediaStreamSource(micStream);analyser=audioCtx.createAnalyser();analyser.fftSize=256;src.connect(analyser);mediaRecorder=new MediaRecorder(micStream);voiceChunks=[];waveLevels=[];isPaused=false;mediaRecorder.ondataavailable=function(e){if(e.data.size)voiceChunks.push(e.data)};mediaRecorder.onstop=function(){voiceBlob=new Blob(voiceChunks,{type:"audio/webm"});voiceUrl=URL.createObjectURL(voiceBlob);document.getElementById("recPlayBtn").style.display="block";document.getElementById("pauseBtn").style.display="none";if(micStream)micStream.getTracks().forEach(function(t){t.stop()});if(audioCtx)audioCtx.close();cancelAnimationFrame(waveRAF)};mediaRecorder.start(250);isRecording=true;document.getElementById("recBar").style.display="flex";document.getElementById("normalInputRow").style.display="none";recSecs=0;clearInterval(recTimerInt);recTimerInt=setInterval(function(){if(!isPaused){recSecs++;var m=Math.floor(recSecs/60),s=recSecs%60;document.getElementById("recBarText").textContent=(m<10?"0"+m:m)+":"+(s<10?"0"+s:s)}},1000);var dataArr=new Uint8Array(analyser.frequencyBinCount);function loop(){if(!isRecording)return;if(!isPaused&&analyser){analyser.getByteTimeDomainData(dataArr);var sum=0;for(var i=0;i<dataArr.length;i++){var v=(dataArr[i]-128)/128;sum+=v*v}waveLevels.push(Math.min(1,Math.sqrt(sum/dataArr.length)*6));if(waveLevels.length>80)waveLevels.shift()}drawWaveBars();waveRAF=requestAnimationFrame(loop)}loop()}catch(e){alert("Mic blocked: "+e.message)}}
function togglePauseVoice(){if(!mediaRecorder)return;if(!isPaused){try{mediaRecorder.pause()}catch(e){}isPaused=true;document.getElementById("pauseBtn").textContent="▶️"}else{try{mediaRecorder.resume()}catch(e){}isPaused=false;document.getElementById("pauseBtn").textContent="⏸️"}}
function stopVoiceRecording(){if(!isRecording)return;isRecording=false;isPaused=false;clearInterval(recTimerInt);if(mediaRecorder&&mediaRecorder.state!=="inactive")mediaRecorder.stop()}
function toggleRecPreview(){if(!voiceUrl)return;if(!previewAudio){previewAudio=new Audio(voiceUrl);previewAudio.onended=function(){isPreviewPlaying=false;document.getElementById("recPlayBtn").textContent="▶️"}}if(!isPreviewPlaying){previewAudio.play();isPreviewPlaying=true;document.getElementById("recPlayBtn").textContent="⏸️"}else{previewAudio.pause();isPreviewPlaying=false;document.getElementById("recPlayBtn").textContent="▶️"}}
function cancelVoice(){voiceBlob=null;voiceUrl='';waveLevels=[];if(previewAudio){previewAudio.pause();previewAudio=null}isPreviewPlaying=false;document.getElementById("recBar").style.display="none";document.getElementById("normalInputRow").style.display="flex";if(isRecording)stopVoiceRecording()}
function sendVoice(){if(!voiceBlob&&!isRecording){alert("No voice yet");return}if(isRecording){stopVoiceRecording();setTimeout(sendVoice,400);return}var reader=new FileReader();reader.onload=function(){var data=reader.result;var arr=getMsgs(selectedName);var id="s_"+Date.now();arr.push({id:id,me:true,text:"",replyTo:replyToText||"",time:Date.now(),type:"voice",data:data,dur:recSecs,wave:waveLevels.slice()});setMsgs(selectedName,arr);cancelVoice();cancelReply();renderChat(true);renderAll();cloudCall({action:"send_message",from:myCleanPhone(),to:"secret_"+selectedName,text:"",type:"voice",data:data,dur:recSecs,wave:waveLevels.slice(),replyTo:replyToText||"",secret:true})};reader.readAsDataURL(voiceBlob)}
function playVoice(id,btn){var arr=getMsgs(selectedName);var m=arr.find(function(x){return x.id===id});if(!m||!m.data)return;var aud=document.getElementById("voiceAud_"+id);if(!aud){aud=document.createElement("audio");aud.id="voiceAud_"+id;aud.src=m.data;aud.style.display="none";document.body.appendChild(aud);aud.onended=function(){btn.textContent="▶️"}}if(aud.paused){document.querySelectorAll('audio[id^="voiceAud_"]').forEach(function(a){if(a!==aud)a.pause()});aud.play();btn.textContent="⏸️"}else{aud.pause();btn.textContent="▶️"}}
// ★★★ FILE - ASK WHERE TO DOWNLOAD ★★★
function askDownload(i){var m=getMsgs(selectedName)[i];if(!m)return;dlMsg=m;closeMsgMenu();document.getElementById("dlName").textContent=m.fileName||"File";document.getElementById("dlOverlay").style.display="flex"}
function closeDl(){dlMsg=null;document.getElementById("dlOverlay").style.display="none"}
function dlToPhone(){if(!dlMsg||!dlMsg.data){alert("File not available on this phone.");closeDl();return}var a=document.createElement("a");a.href=dlMsg.data;a.download=dlMsg.fileName||"file";document.body.appendChild(a);a.click();a.remove();alert("📱 Downloaded to Phone");closeDl()}
function dlToSafe(){if(!dlMsg){closeDl();return}var safe=[];try{safe=JSON.parse(localStorage.getItem("tati_safe_files")||"[]")}catch(e){safe=[]}safe.unshift({name:dlMsg.fileName||"File",type:dlMsg.fileType||"",data:dlMsg.data||"",date:new Date().toLocaleString(),from:"Secret Room - "+selectedName});localStorage.setItem("tati_safe_files",JSON.stringify(safe));alert("📦 Saved to Safe Box");closeDl();if(confirm("Open Safe Box now?"))window.location.href="./safe.html"}
document.getElementById("fileInput").addEventListener("change",function(){var f=this.files[0];if(!f||!selectedName)return;var reader=new FileReader();reader.onload=function(){var data=reader.result;var arr=getMsgs(selectedName);var id="s_"+Date.now();arr.push({id:id,me:true,text:"",time:Date.now(),type:"file",data:data,fileName:f.name,fileType:f.type||""});setMsgs(selectedName,arr);this.value="";renderChat(true);renderAll();cloudCall({action:"send_message",from:myCleanPhone(),to:"secret_"+selectedName,text:"",type:"file",data:data,fileName:f.name,fileType:f.type||"",secret:true})};reader.readAsDataURL(f);this.value=""});
renderAll();setInterval(pollSecret,2500);
