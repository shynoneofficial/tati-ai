<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Create Page - Tati - SHYNONE MUSIC</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif}
html,body{width:100%;min-height:100dvh;background:#fff}
body{display:flex;flex-direction:column;min-height:100dvh;background:#fff;padding-top:72px}
/* SAME HEADER AS index.html */
#header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-bottom:3px solid #0a192f;flex-shrink:0;position:fixed;top:0;left:0;right:0;background:#fff;z-index:5000}
#avatar{width:52px;height:52px;border-radius:12px;object-fit:contain;background:transparent;border:none;flex-shrink:0;padding:0}
#tatiOnline{font-size:12px;color:#00a884;font-weight:800}
#centerLogo{flex:0 0 auto;margin:0 auto;text-align:center;line-height:1.1;cursor:pointer;padding:6px 12px;width:auto;max-width:130px}
#centerLogo b{font-size:16px;font-weight:900;letter-spacing:.5px}
#centerLogo i{font-style:normal;font-size:9px;letter-spacing:4px;color:#00a884;font-weight:800}
.topBtn{padding:11px 12px;border-radius:16px;border:none;font-size:16px;font-weight:800;cursor:pointer;background:#f0f2f5;text-decoration:none;color:#111;max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pagesBtn{padding:8px 10px;font-size:14px;background:#fff;color:#0a192f;border:1.5px solid #e53935;border-radius:12px;display:inline-flex;align-items:center;gap:4px}
#pagesBtn .pageIcon{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;background:#fff;color:#e53935;border:1.5px solid #e53935;border-radius:5px;font-size:13px;line-height:1}
#greenLine{height:4mm;background:#00a884;flex-shrink:0}
.wrap{max-width:720px;margin:0 auto;padding:16px;width:100%;background:#f6f3ee;flex:1}
.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
h1{font-size:22px} h1 span{color:#00a884} p{color:#667781;margin-top:8px;line-height:1.5;font-size:14px}
label{font-weight:800;margin-top:18px;display:block;font-size:14px}
input,textarea,select{width:100%;padding:13px;margin-top:8px;border:1px solid #ddd;border-radius:10px;font-size:15px;outline:none}
.preview{margin-top:14px;display:flex;gap:14px;align-items:center;background:#f0f2f5;border-radius:12px;padding:12px}
.avatar{width:60px;height:60px;border-radius:12px;background:#0a192f;color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.btn{width:100%;margin-top:20px;padding:14px;border:none;border-radius:12px;background:#00a884;color:#fff;font-weight:800;font-size:16px;cursor:pointer}
.btn2{width:100%;margin-top:10px;padding:12px;border:1px solid #ddd;border-radius:12px;background:#fff;font-weight:700;cursor:pointer}
</style></head><body>
<div id="header">
<img id="avatar" src="./Tati_logo.png" onerror="this.src='./Tate.jpg'">
<div><div id="tatiOnline">● Online</div></div>
<div id="centerLogo" onclick="window.location.href='./index.html'"><b>SHYNONE</b><br><i>MUSIC</i></div>
<div style="display:flex;gap:6px;align-items:center">
<a class="topBtn" id="pagesBtn" href="./pages.html"><span class="pageIcon">≡</span> Pages</a>
<a class="topBtn" href="./index.html">← Back</a>
</div>
</div>
<div id="greenLine"></div>
<div class="wrap">
<div class="card">
<h1>✨ Create your Page <span>.</span></h1>
<p>Make a Page for your music, business, church, school or yourself. After you create it, you will go back to Pages and you can post inside it.</p>
<label>1. Page Name *</label>
<input id="pageName" placeholder="e.g. SHYNONE MUSIC" oninput="updatePreview()">
<label>2. What is your Page about?</label>
<textarea id="pageAbout" rows="2" placeholder="e.g. We sing gospel, we make people happy..."></textarea>
<label>3. Category</label>
<select id="pageType"><option>🎵 Music</option><option>💼 Business</option><option>⛪ Church</option><option>🏫 School</option><option>👤 Personal</option><option>⚽ Sport</option><option>🛍️ Shop</option><option>🎬 Entertainment</option><option>🍽️ Food</option></select>
<label>4. Go Live? (optional)</label>
<select id="pageLive"><option value="">No - not live now</option><option value="1">🔴 Yes - I am LIVE now</option></select>
<label>5. Page Profile Photo (optional)</label>
<input type="file" id="pagePhoto" accept="image/*">
<label>6. Cover Photo (optional)</label>
<input type="file" id="pageCover" accept="image/*">
<div class="preview"><div class="avatar" id="prevAvatar">T</div><div><b id="prevName">Your Page Name</b><p id="prevAbout" style="margin:0;font-size:13px">Your about will show here...</p></div></div>
<button class="btn" onclick="createPage()">+ Create My Page →</button>
<button class="btn2" onclick="location.href='./pages.html'">Cancel</button>
</div>
</div>
<script>
var photo="",cover="";
function updatePreview(){var n=document.getElementById("pageName").value.trim()||"Your Page Name";document.getElementById("prevName").textContent=n;document.getElementById("prevAvatar").textContent=n.charAt(0).toUpperCase();document.getElementById("prevAbout").textContent=document.getElementById("pageAbout").value.trim()||"Your about will show here...";}
document.getElementById("pagePhoto").addEventListener("change",function(e){var f=e.target.files[0]; if(!f) return; var r=new FileReader(); r.onload=function(){photo=r.result; document.getElementById("prevAvatar").innerHTML='<img src="'+photo+'">'}; r.readAsDataURL(f)});
document.getElementById("pageCover").addEventListener("change",function(e){var f=e.target.files[0]; if(!f) return; var r=new FileReader(); r.onload=function(){cover=r.result}; r.readAsDataURL(f)});
function createPage(){var n=document.getElementById("pageName").value.trim();var a=document.getElementById("pageAbout").value.trim();var ty=document.getElementById("pageType").value;var live=document.getElementById("pageLive").value==="1";if(!n){alert("Please type Page name"); return}var list=[]; try{list=JSON.parse(localStorage.getItem("tati_pages_v2")||"[]")}catch(e){list=[]}list.push({name:n,about:a||ty,type:ty,photo:photo,cover:cover,followers:0,following:false,notifications:0,live:live,posts:[]});localStorage.setItem("tati_pages_v2",JSON.stringify(list));alert("Page created: "+n+" 🎉 Now you can create posts inside it!");location.href="./pages.html";}
</script>
</body></html>
