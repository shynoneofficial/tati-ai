<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Create Page - Tati - SHYNONE MUSIC</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#f6f3ee;padding-top:72px;min-height:100dvh}
#header{height:72px;display:flex;align-items:center;justify-content:center;border-bottom:3px solid #0a192f;position:fixed;top:0;left:0;right:0;background:#fff;z-index:5000}
#avatar{width:52px;height:52px;border-radius:12px;object-fit:contain;position:absolute;left:10px}
#centerLogo{text-align:center;line-height:1.1;text-decoration:none;color:#111}
#centerLogo b{font-size:16px;font-weight:900}
#centerLogo i{font-style:normal;font-size:9px;letter-spacing:4px;color:#00a884;font-weight:800}
#greenLine{height:4mm;background:#00a884}
.wrap{max-width:720px;margin:0 auto;padding:16px;width:100%}
.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
h1{font-size:22px}h1 span{color:#00a884}p{color:#667781;margin-top:8px;line-height:1.5;font-size:14px}
label{font-weight:800;margin-top:18px;display:block;font-size:14px}
input,textarea,select{width:100%;padding:13px;margin-top:8px;border:1px solid #ddd;border-radius:10px;font-size:16px;outline:none}
.btn{width:100%;margin-top:20px;padding:14px;border:none;border-radius:12px;background:#0a192f;color:#fff;font-weight:800;font-size:16px;cursor:pointer;min-height:48px}
.btn2{width:100%;margin-top:10px;padding:12px;border:1px solid #ddd;border-radius:12px;background:#fff;font-weight:700;cursor:pointer;min-height:44px;text-decoration:none;color:#111;display:block;text-align:center}
.coverEdit{margin-top:10px;border-radius:14px;overflow:hidden;background:#0a192f;height:220px;position:relative;touch-action:none;cursor:grab}
.coverEdit img{position:absolute;top:50%;left:50%;max-width:none;will-change:transform}
.coverEdit .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;text-align:center;padding:20px}
.controls{display:flex;gap:8px;align-items:center;margin-top:8px;background:#f0f2f5;border-radius:10px;padding:10px}
.controls span{font-size:13px;font-weight:800;white-space:nowrap}
.controls input[type=range]{flex:1}
.controls button{padding:10px 12px;border:none;background:#0a192f;color:#fff;border-radius:999px;font-weight:800;cursor:pointer;min-height:40px}
.profileWrap{display:flex;gap:16px;align-items:flex-start;margin-top:10px;flex-wrap:wrap}
.profileEdit{width:200px;height:200px;border-radius:50%;overflow:hidden;background:#0a192f;position:relative;flex-shrink:0;border:4px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.2);touch-action:none;cursor:grab}
.profileEdit img{position:absolute;top:50%;left:50%;max-width:none;will-change:transform}
.profileEdit .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:48px}
.profileSide{flex:1;min-width:180px}
.profileSide b{font-size:16px}
@media(max-width:820px){.card{padding:14px}.profileEdit{width:170px;height:170px}.coverEdit{height:190px}}
</style></head><body>
<div id="header"><a href="./index.html"><img id="avatar" src="./Tati_logo.png" onerror="this.src='./Tate.jpg'"></a><a href="./index.html" id="centerLogo"><b>SHYNONE</b><br><i>MUSIC</i></a></div>
<div id="greenLine"></div>
<div class="wrap"><div class="card">
<h1>Create your Page <span>.</span></h1>
<p id="welcomeText"></p>
<form action="javascript:createPage()">
<label>1. Page Name *</label>
<input id="pageName" placeholder="Page Name" required>
<label>2. What is your Page about?</label>
<textarea id="pageAbout" rows="2" placeholder="What is your Page about?"></textarea>
<label>3. Category *</label>
<select id="pageType" onchange="checkOther()">
<option>🎵 Music</option><option>💼 Business</option><option>⛪ Church</option><option>🏫 School</option><option>👤 Personal</option><option>⚽ Sport</option><option>🛍️ Shop</option><option>🎬 Entertainment</option><option>🍽️ Food</option><option>👗 Fashion</option><option>💄 Beauty</option><option>❤️ Health</option><option>💻 Technology</option><option>📰 News</option><option>📚 Education</option><option>👥 Community</option><option>🤝 NGO</option><option>🎨 Art</option><option>📷 Photography</option><option>😂 Comedy</option><option>🎙️ Podcast</option><option>🎮 Gaming</option><option>✈️ Travel</option><option>🌾 Agriculture</option><option>🚚 Transport</option><option>🏠 Real Estate</option><option>✨ Other</option>
</select>
<div id="otherBox" style="display:none"><label>What is this Other? Type it *</label><input id="otherText" placeholder="e.g. Plumbing, Taxi, Hair Salon"></div>
<label>4. Go Live?</label>
<select id="pageLive"><option value="">No</option><option value="1">🔴 Yes - I am LIVE now</option></select>

<label>5. Profile Photo</label>
<div class="profileWrap">
<div class="profileEdit" id="profileBox"><div class="ph" id="profilePH">T</div><img id="profileImg" style="display:none"></div>
<div class="profileSide"><b id="prevName">Your Page Name</b><p id="prevType">🎵 Music</p><p id="prevAbout">Your about will show here...</p><div class="controls" style="margin-top:12px"><span>Zoom</span><input type="range" id="profileZoom" min="1" max="3" step="0.01" value="1"></div><button type="button" onclick="resetProfile()" style="margin-top:8px;padding:10px 14px;border:none;background:#0a192f;color:#fff;border-radius:999px;font-weight:800;cursor:pointer">Reset</button></div>
</div>
<input type="file" id="pagePhoto" accept="image/*">

<label>6. Cover Photo</label>
<div class="coverEdit" id="coverBox"><div class="ph" id="coverPH">📷 Cover</div><img id="coverImg" style="display:none"></div>
<div class="controls"><span>Zoom</span><input type="range" id="coverZoom" min="1" max="3" step="0.01" value="1"><button type="button" onclick="resetCover()">Reset</button></div>
<input type="file" id="pageCover" accept="image/*">

<button class="btn" id="createBtn" type="submit">+ Create My Page →</button>
</form>
<a class="btn2" href="./pages.html">← Back</a>
</div></div>
<script>
const PAGES_WORKER_URL="https://tati-pages.dilemahluza.workers.dev";
function cleanPhone(p){var s=String(p||"").trim().replace(/\D/g,"");if(s.startsWith("00"))s=s.slice(2);return s;}
function getMainUser(){try{const p=JSON.parse(localStorage.getItem('tati_my_profile')||'{}');if(p&&p.name&&p.number){return{id:cleanPhone(p.number),name:p.name,phone:p.number,setupDone:!!(p.setupDone||(p.selfieVerified&&p.name&&p.number))};}}catch(e){}const ph=localStorage.getItem('tati_my_phone')||"";const nm=localStorage.getItem('tati_my_name')||"";if(ph&&nm)return{id:cleanPhone(ph),name:nm,phone:ph,setupDone:true};return null;}
const me=getMainUser();
if(!me||!me.setupDone){alert("Finish Setup in People first.");location.href="./people.html";}else{document.getElementById("welcomeText").innerHTML="Hello <b>"+me.name+"</b> 👋";}
function checkOther(){document.getElementById("otherBox").style.display=document.getElementById("pageType").value.indexOf("Other")>-1?"block":"none";updateText();}
function getCategory(){const s=document.getElementById("pageType").value;if(s.indexOf("Other")>-1){const o=document.getElementById("otherText").value.trim();return o?("✨ "+o):"✨ Other";}return s;}
function updateText(){var n=document.getElementById("pageName").value.trim()||"Your Page Name";document.getElementById("prevName").textContent=n;if(!profileCrop.state.img)document.getElementById("profilePH").textContent=n.charAt(0).toUpperCase();document.getElementById("prevAbout").textContent=document.getElementById("pageAbout").value.trim()||"Your about will show here...";document.getElementById("prevType").textContent=getCategory();}
document.getElementById("pageName").addEventListener("input",updateText);
document.getElementById("pageAbout").addEventListener("input",updateText);
document.getElementById("otherText").addEventListener("input",updateText);
function makeCropper(boxId,imgId,zoomId){
  const box=document.getElementById(boxId), img=document.getElementById(imgId), zoom=document.getElementById(zoomId);
  const st={img:null,scale:1,base:1,x:0,y:0,nw:0,nh:0};
  function apply(){if(!st.img)return;const w=st.nw*st.base*st.scale,h=st.nh*st.base*st.scale;img.style.width=w+"px";img.style.height=h+"px";img.style.transform="translate(-50%,-50%) translate("+st.x+"px,"+st.y+"px)";}
  function clamp(){if(!st.img)return;const bw=box.clientWidth,bh=box.clientHeight,w=st.nw*st.base*st.scale,h=st.nh*st.base*st.scale;const maxX=Math.max(0,(w-bw)/2),maxY=Math.max(0,(h-bh)/2);st.x=Math.max(-maxX,Math.min(maxX,st.x));st.y=Math.max(-maxY,Math.min(maxY,st.y));}
  function fit(){if(!st.img)return;const bw=box.clientWidth,bh=box.clientHeight;st.base=Math.max(bw/st.nw,bh/st.nh);st.scale=1;st.x=0;st.y=0;zoom.value=1;clamp();apply();}
  function setImage(src){const im=new Image();im.onload=function(){st.img=im;st.nw=im.naturalWidth;st.nh=im.naturalHeight;img.src=src;img.style.display="block";const ph=box.querySelector(".ph");if(ph)ph.style.display="none";fit();};im.src=src;}
  let dragging=false,sx=0,sy=0,ox=0,oy=0;
  function start(e){if(!st.img)return;dragging=true;const p=e.touches?e.touches[0]:e;sx=p.clientX;sy=p.clientY;ox=st.x;oy=st.y;}
  function move(e){if(!dragging)return;e.preventDefault();const p=e.touches?e.touches[0]:e;st.x=ox+(p.clientX-sx);st.y=oy+(p.clientY-sy);clamp();apply();}
  function end(){dragging=false;}
  box.addEventListener("pointerdown",start);box.addEventListener("pointermove",move);box.addEventListener("pointerup",end);box.addEventListener("pointercancel",end);
  box.addEventListener("touchstart",start,{passive:false});box.addEventListener("touchmove",move,{passive:false});box.addEventListener("touchend",end);
  zoom.addEventListener("input",function(){st.scale=parseFloat(zoom.value);clamp();apply();});
  function reset(){if(!st.img)return;st.scale=1;st.x=0;st.y=0;zoom.value=1;clamp();apply();}
  function cropTo(size,circle){
    if(!st.img)return "";
    const bw=box.clientWidth,bh=box.clientHeight;
    const scaleX=st.nw/(st.nw*st.base*st.scale);
    const dispW=st.nw*st.base*st.scale,dispH=st.nh*st.base*st.scale;
    const cx=(dispW/2-st.x)*scaleX, cy=(dispH/2-st.y)*scaleX;
    const cropW=bw*scaleX,cropH=bh*scaleX;
    const sx0=Math.max(0,cx-cropW/2),sy0=Math.max(0,cy-cropH/2);
    const c=document.createElement("canvas");c.width=size;c.height=size;const ctx=c.getContext("2d");
    if(circle){ctx.beginPath();ctx.arc(size/2,size/2,size/2,0,Math.PI*2);ctx.clip();}
    ctx.drawImage(st.img,sx0,sy0,cropW,cropH,0,0,size,size);
    return c.toDataURL("image/jpeg",0.85);
  }
  return {state:st,setImage:setImage,reset:reset,cropTo:cropTo};
}
const coverCrop=makeCropper("coverBox","coverImg","coverZoom");
const profileCrop=makeCropper("profileBox","profileImg","profileZoom");
function resetCover(){coverCrop.reset();}
function resetProfile(){profileCrop.reset();}
document.getElementById("pageCover").addEventListener("change",function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){coverCrop.setImage(r.result)};r.readAsDataURL(f);});
document.getElementById("pagePhoto").addEventListener("change",function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){profileCrop.setImage(r.result)};r.readAsDataURL(f);});
async function createPage(){
  var n=document.getElementById("pageName").value.trim();if(!n){alert("Please type Page name");return;}
  const cat=getCategory();if(cat==="✨ Other"){alert("Please type what is your Other category");document.getElementById("otherText").focus();return;}
  const u=getMainUser();if(!u||!u.setupDone){alert("Finish Setup first.");location.href="./people.html";return;}
  let coverOut="",photoOut="";
  try{if(coverCrop.state.img)coverOut=coverCrop.cropTo(1200,false);}catch(e){}
  try{if(profileCrop.state.img)photoOut=profileCrop.cropTo(600,true);}catch(e){}
  document.getElementById("createBtn").textContent="Saving...";document.getElementById("createBtn").disabled=true;
  try{
    const res=await fetch(PAGES_WORKER_URL+"/pages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user_id:u.id,user_name:u.name,name:n,about:document.getElementById("pageAbout").value.trim(),type:cat,live:document.getElementById("pageLive").value==="1",photo:photoOut,cover:coverOut})});
    const data=await res.json();if(!res.ok)throw new Error(data.error||"Server error");
    try{var newId=(data&&(data.id||(data.page&&data.page.id)||(data.data&&data.data.id)))||"";if(newId){var ids=JSON.parse(localStorage.getItem("tati_my_page_ids")||"[]");if(!ids.includes(newId))ids.push(newId);localStorage.setItem("tati_my_page_ids",JSON.stringify(ids));}}catch(e){}
    alert("Page created! 🎉 "+n);location.href="./pages.html";
  }catch(e){alert("Cannot save: "+e.message);document.getElementById("createBtn").textContent="+ Create My Page →";document.getElementById("createBtn").disabled=false;}
}
</script>
</body></html>
