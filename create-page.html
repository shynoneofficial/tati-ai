<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Create Page - Tati - SHYNONE MUSIC</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif}
body{display:flex;flex-direction:column;min-height:100dvh;background:#fff;padding-top:72px}
#header{height:72px;display:flex;align-items:center;justify-content:center;padding:0 10px;border-bottom:3px solid #0a192f;position:fixed;top:0;left:0;right:0;background:#fff;z-index:5000}
#avatar{width:52px;height:52px;border-radius:12px;object-fit:contain;cursor:pointer;position:absolute;left:10px}
#tatiOnline{font-size:12px;color:#00a884;font-weight:800;position:absolute;left:68px}
#centerLogo{text-align:center;line-height:1.1;cursor:pointer;padding:6px 12px}
#centerLogo b{font-size:16px;font-weight:900;letter-spacing:.5px}
#centerLogo i{font-style:normal;font-size:9px;letter-spacing:4px;color:#00a884;font-weight:800}
#greenLine{height:4mm;background:#00a884}
.wrap{max-width:720px;margin:0 auto;padding:16px;width:100%;background:#f6f3ee;flex:1}
.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
h1{font-size:22px} h1 span{color:#00a884} p{color:#667781;margin-top:8px;line-height:1.5;font-size:14px}
label{font-weight:800;margin-top:18px;display:block;font-size:14px}
input,textarea,select{width:100%;padding:13px;margin-top:8px;border:1px solid #ddd;border-radius:10px;font-size:15px;outline:none}
.preview{margin-top:14px;display:flex;gap:14px;align-items:center;background:#f0f2f5;border-radius:12px;padding:12px}
.avatar{width:60px;height:60px;border-radius:12px;background:#0a192f;color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.btn{width:100%;margin-top:20px;padding:14px;border:none;border-radius:12px;background:#0a192f;color:#fff;font-weight:800;font-size:16px;cursor:pointer}
.btn2{width:100%;margin-top:10px;padding:12px;border:1px solid #ddd;border-radius:12px;background:#fff;font-weight:700;cursor:pointer}
</style></head><body>
<div id="header">
<img id="avatar" src="./Tati_logo.png" onerror="this.src='./Tate.jpg'" onclick="window.location.href='./index.html'">
<div id="tatiOnline">● Online</div>
<div id="centerLogo" onclick="window.location.href='./index.html'"><b>SHYNONE</b><br><i>MUSIC</i></div>
</div>
<div id="greenLine"></div>
<div class="wrap"><div class="card">
<h1>Create your Page <span>.</span></h1>
<p id="welcomeText">Uses your <b>People (Mabulu) registration</b>. Saved in <b>Tati Pages server</b> — not in phone.</p>
<label>1. Page Name *</label>
<input id="pageName" placeholder="e.g. SHYNONE MUSIC" oninput="updatePreview()">
<label>2. What is your Page about?</label>
<textarea id="pageAbout" rows="2" placeholder="e.g. We sing gospel..."></textarea>
<label>3. Category</label>
<select id="pageType"><option>🎵 Music</option><option>💼 Business</option><option>⛪ Church</option><option>🏫 School</option><option>👤 Personal</option><option>⚽ Sport</option><option>🛍️ Shop</option><option>🎬 Entertainment</option><option>🍽️ Food</option></select>
<label>4. Go Live?</label>
<select id="pageLive"><option value="">No</option><option value="1">🔴 Yes - I am LIVE now</option></select>
<label>5. Page Profile Photo (optional)</label>
<input type="file" id="pagePhoto" accept="image/*">
<label>6. Cover Photo (optional)</label>
<input type="file" id="pageCover" accept="image/*">
<div class="preview"><div class="avatar" id="prevAvatar">T</div><div><b id="prevName">Your Page Name</b><p id="prevAbout" style="margin:0;font-size:13px">Your about will show here...</p></div></div>
<button class="btn" id="createBtn" onclick="createPage()">+ Create My Page →</button>
<button class="btn2" onclick="goBack()">← Back</button>
</div></div>
<script>
const PAGES_WORKER_URL="https://tati-pages.dilemahluza.workers.dev";
function cleanPhone(p){ var s=String(p||"").replace(/\D/g,""); if(s.startsWith("258")&&s.length===12) s=s.slice(3); if(s.startsWith("0")&&s.length===10) s=s.slice(1); return s; }
// EXACT same as people.html: tati_my_profile
function getMainUser(){
  try{
    const p = JSON.parse(localStorage.getItem('tati_my_profile')||'{}');
    if(p && p.name && p.number){
      const isDone = !!(p.setupDone || (p.selfieVerified && p.name && p.number));
      return {id: cleanPhone(p.number), name: p.name, phone: p.number, cleanPhone: cleanPhone(p.number), selfie: p.selfie||"", setupDone: isDone};
    }
  }catch(e){}
  const ph = localStorage.getItem('tati_my_phone')||"";
  const nm = localStorage.getItem('tati_my_name')||"";
  if(ph && nm) return {id: cleanPhone(ph), name: nm, phone: ph, cleanPhone: cleanPhone(ph), setupDone:true};
  return null;
}
function goBack(){ if(window.history.length>1){ window.history.back(); } else { window.location.href="./pages.html"; } }
const me = getMainUser();
if(!me || !me.setupDone){
  if(me && !me.setupDone){ alert("Almost done! Go to People (Mabulu) and finish Setup: take Selfie + tap 'I Am Done'. Then come back."); }
  else { alert("Please finish Setup in People (Mabulu) first: Name + Number + Selfie. One registration works for Chats + Pages."); }
  location.href="./people.html";
} else {
  document.getElementById("welcomeText").innerHTML = "Hello <b>"+me.name+"</b> 👋 — Uses your <b>People registration</b> ("+me.phone+"). Saved in <b>Tati Pages server</b>.";
}
var photo="",cover="";
function updatePreview(){var n=document.getElementById("pageName").value.trim()||"Your Page Name";document.getElementById("prevName").textContent=n;document.getElementById("prevAvatar").textContent=n.charAt(0).toUpperCase();document.getElementById("prevAbout").textContent=document.getElementById("pageAbout").value.trim()||"Your about will show here...";}
document.getElementById("pagePhoto").addEventListener("change",function(e){var f=e.target.files[0]; if(!f) return; var r=new FileReader(); r.onload=function(){photo=r.result; document.getElementById("prevAvatar").innerHTML='<img src="'+photo+'">'}; r.readAsDataURL(f)});
document.getElementById("pageCover").addEventListener("change",function(e){var f=e.target.files[0]; if(!f) return; var r=new FileReader(); r.onload=function(){cover=r.result}; r.readAsDataURL(f)});
async function createPage(){
  var n=document.getElementById("pageName").value.trim();
  if(!n){alert("Please type Page name"); return;}
  const u=getMainUser();
  if(!u || !u.setupDone){ alert("Finish Setup in People first."); location.href="./people.html"; return; }
  document.getElementById("createBtn").textContent="Saving to Tati Pages server..."; document.getElementById("createBtn").disabled=true;
  try{
    const res=await fetch(PAGES_WORKER_URL+"/pages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user_id:u.id,user_name:u.name,name:n,about:document.getElementById("pageAbout").value.trim(),type:document.getElementById("pageType").value,live:document.getElementById("pageLive").value==="1",photo:photo,cover:cover})});
    const data=await res.json();
    if(!res.ok) throw new Error(data.error||"Server error");
    alert("Page created! 🎉 "+n);
    location.href="./pages.html";
  }catch(e){ alert("Cannot save: "+e.message); document.getElementById("createBtn").textContent="+ Create My Page →"; document.getElementById("createBtn").disabled=false; }
}
</script>
</body></html>
